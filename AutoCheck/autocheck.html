<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCheck - Pré-Avaliação Veicular</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo(2).png">
</head>

<body>

    <div class="container">

        <img src="logo (2).png" width="500" alt="AutoCheck Logo">

       

        <p>Responda e descubra a orientação para seu veículo.</p>

        <form action="autocheck.php" method="POST">

            <div class="form-group">
                <label>Tipo de veículo:</label>

                <select name="veiculo" required>
                    <option value="">Selecione...</option>
                    <option value="Carro">Carro</option>
                    <option value="Moto">Moto</option>
                    <option value="Caminhonete">Caminhonete</option>
                </select>
            </div>

            <div class="form-group">
                <label>Qual o problema percebido?</label>

                <select name="problema" required>
                    <option value="">Selecione...</option>
                    <option value="Freio">Dificuldade para frear</option>
                    <option value="Barulho">Barulho estranho</option>
                    <option value="Motor">Motor falhando</option>
                    <option value="Pneu">Pneu desgastado</option>
                </select>
            </div>

            <button type="submit">Analisar 🚗</button>

        </form>

    </div>

</body>

</html>
